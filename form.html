    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form-normalize.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>
	<header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="wf1">
            <label for="productName">Product Name (* is required)
                <select name="product" id="productName" required>
                    <option value="" disabled selected> select a product &#9662;</option>
                </select>
            </label>           
            <fieldset><legend>Overall Rating *</legend>
                <label for="oneStar"><input type="radio" name="rating" id="oneStar" value="1" required> &star;</label>
                <label for="twoStar"><input type="radio" name="rating" id="twoStar" value="2" required> &star;&star;</label>
                <label for="threeStar"><input type="radio" name="rating" id="threeStar" value="3" required> &star;&star;&star;</label>
                <label for="fourStar"><input type="radio" name="rating" id="fourStar" value="4" required> &star;&star;&star;&star;</label>
                <label for="fiveStar"><input type="radio" name="rating" id="fiveStar" value="5" required> &star;&star;&star;&star;&star;</label>
            </fieldset>
            <label for="installDate">Date of Installation * <input type="date" id="installDate" name="installDate" required></label>
            <div>Which features did you find userful in this product?<br><em>(Check all that apply)</em></div>
            <label for="durability"><input type="checkbox" id="durability" name="durability" value="yes"> Durability</label>
            <label for="ease"><input type="checkbox" id="ease" name="ease" value="yes"> Ease of Use</label>
            <label for="performance"><input type="checkbox" id="performance" name="performance" value="yes"> Performance</label>
            <label for="design"><input type="checkbox" id="design" name="design" value="yes"> Design</label>
            <label for="reviewText" class="separateText">Written Review <span class="optext">(Optional)</span><textarea id="reviewText" name="review">enter text here</textarea></label>
            <label for="nameText" class="separateText">Your Name <span class="optext">(Optional)</span><input type="text" id="nameText" name="name" value="enter your name"></label>
            <label><input type="submit" value="Post Your Review"></label>
        </form>
    </main>
    <footer>
        <p class="name-info">&copy;<span id="currentyear"></span> 🎸 James Eric Leight 🎸 U.S.A</p>
        <p class="modified">Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
